# Envia a base do TSE e os mapas (public/data/tse, public/geojson) para o
# bucket público "dados" do Storage do Supabase — de onde o sistema passa a
# buscá-los quando NEXT_PUBLIC_DADOS_URL estiver configurada (lib/dados-url.ts).
# Rodar à mão (Actions → Run workflow). Só no math716.
name: "Dados · Enviar ao Storage"
on:
  workflow_dispatch:
    inputs:
      pastas:
        description: "Pastas de public/ (ex.: data/tse,geojson ou data/tse/2026)"
        default: "data/tse,geojson"
      modo:
        description: "enviar = manda os arquivos; verificar = só confere os tamanhos"
        type: choice
        options: [enviar, verificar]
        default: enviar
jobs:
  enviar:
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/data/tse
            public/geojson
            scripts/dados
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/dados/enviar-storage.mjs --pastas "${{ inputs.pastas }}" ${{ inputs.modo == 'verificar' && '--verificar' || '' }}
        env:
          SUPABASE_URL: https://mtjugadcnwjbcpfzavxs.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
