name: Dedup parlamentares

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (não altera o banco)'
        required: false
        default: true
        type: boolean


# Fila única das importações: um workflow que escreve no banco espera o outro
# terminar (inclusive disparo manual). Rodando juntos, a federal (150 operações
# simultâneas), SP e DF disputavam o banco na madrugada de segunda.
# Atenção: o GitHub guarda só UM pendente por grupo — um terceiro na fila
# substitui o pendente anterior. Por isso cada importação pesada tem o seu dia.
concurrency:
  group: importacao-banco
  cancel-in-progress: false

jobs:
  dedup:
    name: Dedup parlamentares
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Dedup parlamentares
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN ==="
            npx tsx --require dotenv/config scripts/dedup-parlamentares.ts --dry-run
          else
            echo "=== APLICANDO ==="
            npx tsx --require dotenv/config scripts/dedup-parlamentares.ts
          fi

      - name: Atualizar resumo de Emendas
        # Números prontos da tela de Emendas (scripts/atualizar-resumo-emendas.ts).
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/atualizar-resumo-emendas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Dedup parlamentares" >> $GITHUB_STEP_SUMMARY
          echo "- **Modo:** ${{ github.event.inputs.dry_run == 'true' && 'Dry run' || 'Real' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
