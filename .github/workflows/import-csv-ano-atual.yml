name: Import CSV - emendas federais

on:
  # schedules pausados até validar conclusão do import completo
  # - cron: '0 2 * * 1'    # Toda segunda-feira 2h UTC → 2025 e 2026
  # - cron: '0 2 1 * *'    # Dia 1 do mês 2h UTC       → 2024
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos a importar, separados por vírgula (ex: 2024,2025,2026)'
        required: false
        default: '2025,2026'
        type: string
      batch:
        description: 'Tamanho do chunk de leitura (default 500)'
        required: false
        default: '500'
        type: string
      concurrency:
        description: 'Operacoes simultaneas no banco (default 150)'
        required: false
        default: '150'
        type: string

jobs:
  import-csv:
    name: Import CSV
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ANOS: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.anos ||
            github.event.schedule == '0 2 * * 1' && '2025,2026' ||
            '2024' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/portal-csv-imports

      - name: Baixar CSVs do Portal da Transparencia
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          BASE="https://portaldatransparencia.gov.br"

          echo "=== Obtendo cookies de sessao ==="
          curl -s -c /tmp/portal-cookies.txt \
            --user-agent "$UA" \
            -H "Accept: text/html,*/*" \
            -o /dev/null \
            "$BASE/download-de-dados/emendas-parlamentares-documentos"

          FALHOU=0
          IFS=',' read -ra ANOS_ARRAY <<< "$ANOS"
          for ANO in "${ANOS_ARRAY[@]}"; do
            ANO=$(echo "$ANO" | tr -d ' ')
            ZIP="data/portal-csv-imports/${ANO}_EmendasParlamentaresPorDocumento.zip"
            URL="$BASE/download-de-dados/emendas-parlamentares-documentos/$ANO"

            echo ""
            echo "=== Baixando $ANO ==="
            HTTP_INFO=$(curl -L \
              -b /tmp/portal-cookies.txt \
              --user-agent "$UA" \
              -H "Accept: application/zip,application/octet-stream,*/*" \
              -H "Accept-Language: pt-BR,pt;q=0.9" \
              -H "Referer: $BASE/download-de-dados/emendas-parlamentares-documentos" \
              --retry 3 --retry-delay 10 --retry-all-errors \
              --max-time 1800 \
              -w "\nHTTP_CODE=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}" \
              -o "$ZIP" \
              "$URL")
            echo "$HTTP_INFO"

            MAGIC=$(xxd -p -l 4 "$ZIP" 2>/dev/null || echo "erro-xxd")
            echo "Magic bytes: $MAGIC (esperado 504b0304 para ZIP)"

            if [ "$MAGIC" != "504b0304" ]; then
              echo "ERRO: $ANO nao e um ZIP valido — pulando"
              rm -f "$ZIP"
              FALHOU=1
            else
              echo "ZIP valido: $(stat -c%s "$ZIP") bytes ($(ls -lh "$ZIP" | awk '{print $5}'))"
            fi
          done

          if [ "$FALHOU" != "0" ]; then exit 1; fi

      - name: Importar dados no banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          BATCH="${{ github.event.inputs.batch || '500' }}"
          CONC="${{ github.event.inputs.concurrency || '150' }}"
          IFS=',' read -ra ANOS_ARRAY <<< "$ANOS"
          for ANO in "${ANOS_ARRAY[@]}"; do
            ANO=$(echo "$ANO" | tr -d ' ')
            ZIP="data/portal-csv-imports/${ANO}_EmendasParlamentaresPorDocumento.zip"
            if [ -f "$ZIP" ]; then
              echo "=== Importando $ANO ==="
              npx tsx scripts/import-portal-csv.mts \
                --file "$ZIP" \
                --batch $BATCH \
                --concurrency $CONC
            else
              echo "ZIP nao encontrado para $ANO, pulando."
            fi
          done

      - name: Reclassificar senadores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-senadores.ts

      - name: Reclassificar areas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/reclassificar-areas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Import CSV Federal concluido" >> $GITHUB_STEP_SUMMARY
          echo "- **Anos:** $ANOS" >> $GITHUB_STEP_SUMMARY
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
