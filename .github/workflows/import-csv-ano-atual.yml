name: Import CSV - ano atual

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano a importar'
        required: false
        default: '2026'
        type: string
      batch:
        description: 'Tamanho do chunk de leitura (default 500)'
        required: false
        default: '500'
        type: string
      concurrency:
        description: 'Operacoes simultaneas no banco (default 50, alinhado com connection_limit do Prisma)'
        required: false
        default: '50'
        type: string

jobs:
  import-csv:
    name: Import CSV
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/portal-csv-imports

      - name: Baixar CSV do Portal da Transparencia
        run: |
          ANO="${{ github.event.inputs.ano || '2026' }}"
          ZIP="data/portal-csv-imports/${ANO}_EmendasParlamentaresPorDocumento.zip"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          BASE="https://portaldatransparencia.gov.br"
          URL="$BASE/download-de-dados/emendas-parlamentares-documentos/$ANO"

          echo "=== Passo 1: obter cookies de sessao ==="
          curl -s -c /tmp/portal-cookies.txt \
            --user-agent "$UA" \
            -H "Accept: text/html,*/*" \
            -o /dev/null \
            "$BASE/download-de-dados/emendas-parlamentares-documentos"
          echo "Cookies obtidos:"
          cat /tmp/portal-cookies.txt 2>/dev/null || echo "(nenhum)"

          echo ""
          echo "=== Passo 2: descobrir URL real do arquivo ==="
          REDIRECT_URL=$(curl -s -o /dev/null -w "%{url_effective}" -L \
            -b /tmp/portal-cookies.txt \
            --user-agent "$UA" \
            -H "Accept: application/zip,application/octet-stream,*/*" \
            -H "Referer: $BASE/download-de-dados/emendas-parlamentares-documentos" \
            --max-time 30 \
            "$URL")
          echo "URL final apos redirecionamentos: $REDIRECT_URL"

          echo ""
          echo "=== Passo 3: download com diagnostico ==="
          HTTP_INFO=$(curl -L \
            -b /tmp/portal-cookies.txt \
            --user-agent "$UA" \
            -H "Accept: application/zip,application/octet-stream,*/*" \
            -H "Accept-Language: pt-BR,pt;q=0.9" \
            -H "Referer: $BASE/download-de-dados/emendas-parlamentares-documentos" \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 1800 \
            -w "\nHTTP_CODE=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}" \
            -o "$ZIP" \
            "$URL")
          echo "$HTTP_INFO"

          echo ""
          MAGIC=$(xxd -p -l 4 "$ZIP" 2>/dev/null || echo "erro-xxd")
          echo "Magic bytes: $MAGIC (esperado 504b0304 para ZIP)"

          if [ "$MAGIC" != "504b0304" ]; then
            echo ""
            echo "ERRO: Nao e um ZIP. Primeiros 1000 bytes do que foi baixado:"
            echo "---"
            head -c 1000 "$ZIP"
            echo ""
            echo "---"
            exit 1
          fi

          echo "ZIP valido! Tamanho: $(stat -c%s "$ZIP") bytes ($(ls -lh "$ZIP" | awk '{print $5}'))"

      - name: Importar dados no banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ANO="${{ github.event.inputs.ano || '2026' }}"
          BATCH="${{ github.event.inputs.batch || '500' }}"
          CONC="${{ github.event.inputs.concurrency || '20' }}"
          npx tsx scripts/import-portal-csv.mts \
            --file "data/portal-csv-imports/${ANO}_EmendasParlamentaresPorDocumento.zip" \
            --batch $BATCH \
            --concurrency $CONC

      - name: Reclassificar senadores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-senadores.ts

      - name: Reclassificar areas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/reclassificar-areas.ts

      - name: Resumo
        if: always()
        run: |
          ANO="${{ github.event.inputs.ano || '2026' }}"
          echo "## Import CSV concluido" >> $GITHUB_STEP_SUMMARY
          echo "- **Ano:** $ANO" >> $GITHUB_STEP_SUMMARY
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
