name: Import CSV - ano atual

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano a importar'
        required: false
        default: '2026'
        type: string
      batch:
        description: 'Tamanho do batch (200 recomendado)'
        required: false
        default: '200'
        type: string

jobs:
  import-csv:
    name: Import CSV
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/portal-csv-imports

      - name: Baixar CSV do Portal da Transparencia
        run: |
          ANO="${{ github.event.inputs.ano || '2026' }}"
          ZIP="data/portal-csv-imports/${ANO}_EmendasParlamentaresPorDocumento.zip"
          echo "Baixando emendas de $ANO..."
          curl -L \
            --retry 5 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 1800 \
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/zip, application/octet-stream, */*" \
            -H "Accept-Language: pt-BR,pt;q=0.9" \
            -H "Referer: https://portaldatransparencia.gov.br/download-de-dados/emendas-parlamentares-documentos" \
            "https://portaldatransparencia.gov.br/download-de-dados/emendas-parlamentares-documentos/$ANO" \
            -o "$ZIP"
          echo "Tamanho: $(ls -lh "$ZIP" | awk '{print $5}')"
          MAGIC=$(xxd -p -l 4 "$ZIP")
          if [ "$MAGIC" != "504b0304" ]; then
            echo "ERRO: Arquivo nao e um ZIP valido. Assinatura: $MAGIC (esperado 504b0304)"
            echo "--- Primeiros 500 bytes do arquivo ---"
            head -c 500 "$ZIP"
            echo "--------------------------------------"
            exit 1
          fi
          echo "ZIP valido. Tamanho: $(stat -c%s "$ZIP") bytes"

      - name: Importar dados no banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ANO="${{ github.event.inputs.ano || '2026' }}"
          BATCH="${{ github.event.inputs.batch || '200' }}"
          npx tsx scripts/import-portal-csv.mts \
            --file "data/portal-csv-imports/${ANO}_EmendasParlamentaresPorDocumento.zip" \
            --batch $BATCH

      - name: Reclassificar senadores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-senadores.ts

      - name: Reclassificar areas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/reclassificar-areas.ts

      - name: Resumo
        if: always()
        run: |
          ANO="${{ github.event.inputs.ano || '2026' }}"
          echo "## Import CSV concluido" >> $GITHUB_STEP_SUMMARY
          echo "- **Ano:** $ANO" >> $GITHUB_STEP_SUMMARY
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
