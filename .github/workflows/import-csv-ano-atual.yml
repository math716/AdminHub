name: Rotina · Emendas federais

# ─── Calendário das importações (horário de Brasília) ───────────────────────
# O GitHub agenda em UTC (Brasília + 3h). Todos os workflows que gravam no banco
# estão na MESMA fila (concurrency: importacao-banco): um espera o outro. O
# GitHub guarda só UM esperando — um terceiro que chegue cancela o que estava
# esperando. Por isso cada rotina tem o seu dia.
#
#   Semanal
#     sexta   22h  Rotina · Emendas federais  2025
#     sábado  24h  Rotina · Emendas RJ        2025 e 2026
#     domingo 23h  Rotina · Emendas federais  2026
#     segunda 24h  Rotina · Emendas SP        2025 e 2026
#     terça   24h  Rotina · Emendas DF        2025 e 2026
#     quarta  24h  Rotina · Emendas ES, MG e PE  (os anos cujo arquivo mudou)
#   Mensal
#     dia 1   (23h da véspera)  Rotina · Emendas federais  2024
#     dia 3   (23h da véspera)  Rotina · Emendas SP        2023 e 2024
#     dia 5   (23h da véspera)  Rotina · Emendas DF        2021 a 2024
#     dia 15  (23h da véspera)  Rotina · Emendas federais  2023
#     dia 20  01h               Rotina · Emendas federais  2021 e 2022
#   Manual
#     Ferramenta · Resumo de Emendas — recalcula/confere a tela de Emendas
#     (todas as rotinas já fazem isso no fim; é a reserva).
#
# Arquivo do governo igual ao da última vez → a rotina pula a importação e só
# atualiza totais e resumo (leve). Só os jobs com
# if: github.repository == 'math716/AdminHub' — o admorbitatech nunca executa.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * 1'   # Segunda-feira 2h UTC → 2026
    - cron: '0 1 * * 6'   # Sábado 1h UTC (sexta 22h Brasília) → 2025
    - cron: '0 2 1 * *'   # Dia 1 do mês  2h UTC → 2024
    - cron: '0 2 15 * *'  # Dia 15 do mês 2h UTC → 2023 (a CGU ainda regera o arquivo)
    # Dia 20, 4h UTC (1h Brasília) → 2021 e 2022. Era o workflow à parte
    # "Totais oficiais", que só atualizava os totais; aqui, se a CGU mudou o
    # arquivo, os documentos também vêm. Arquivo igual → só totais e resumo.
    # 4h e não 2h: longe dos outros agendamentos da madrugada (a fila guarda
    # só um esperando, e às 2h o "Totais" já foi cancelado por isso).
    - cron: '0 4 20 * *'
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos a importar, separados por vírgula (ex: 2024,2026)'
        required: false
        default: '2026'
        type: string
      batch:
        description: 'Tamanho do chunk de leitura (default 500)'
        required: false
        default: '500'
        type: string
      concurrency:
        description: 'Operacoes simultaneas no banco (default 80)'
        required: false
        default: '80'
        type: string
      modo:
        description: 'lote = 500 documentos por envio (padrão) | linha = um por vez (reserva)'
        required: false
        default: 'lote'
        type: choice
        options: ['linha', 'lote']
      forcar:
        description: 'Importar mesmo que o arquivo do governo não tenha mudado (desmarcado = arquivo igual só atualiza totais e resumo)'
        required: false
        default: false
        type: boolean


# Fila única das importações: um workflow que escreve no banco espera o outro
# terminar (inclusive disparo manual). Rodando juntos, a federal (150 operações
# simultâneas), SP e DF disputavam o banco na madrugada de segunda.
# Atenção: o GitHub guarda só UM pendente por grupo — um terceiro na fila
# substitui o pendente anterior. Por isso cada importação pesada tem o seu dia.
concurrency:
  group: importacao-banco
  cancel-in-progress: false

jobs:
  import-csv:
    name: Import CSV
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ANOS: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.anos ||
            github.event.schedule == '0 2 * * 1' && '2026' ||
            github.event.schedule == '0 1 * * 6' && '2025' ||
            github.event.schedule == '0 2 15 * *' && '2023' ||
            github.event.schedule == '0 4 20 * *' && '2021,2022' ||
            '2024' }}
      FORCAR: ${{ inputs.forcar && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/portal-csv-imports/.vistos

      # Guarda, por ano, a data e o tamanho do arquivo do governo já importado.
      # Arquivo igual = nada a importar: reimportar 390 mil documentos iguais
      # toda semana gastava a cota diária de disco do banco e deixava o sistema
      # lento (Gabi incluída). A chave muda a cada execução para o valor novo
      # ser salvo; restore-keys recupera o da execução anterior. Cache perdido
      # custa no máximo uma importação a mais.
      - name: Recuperar o que já foi importado
        uses: actions/cache@v4
        with:
          path: data/portal-csv-imports/.vistos
          key: federal-vistos-${{ github.run_id }}
          restore-keys: |
            federal-vistos-

      - name: Baixar CSVs do Portal da Transparencia (só o que mudou)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          BASE="https://portaldatransparencia.gov.br"

          echo "=== Obtendo cookies de sessao ==="
          curl -s -c /tmp/portal-cookies.txt \
            --user-agent "$UA" \
            -H "Accept: text/html,*/*" \
            -o /dev/null \
            "$BASE/download-de-dados/emendas-parlamentares-documentos"

          FALHOU=0
          IFS=',' read -ra ANOS_ARRAY <<< "$ANOS"
          for ANO in "${ANOS_ARRAY[@]}"; do
            ANO=$(echo "$ANO" | tr -d ' ')
            ZIP="data/portal-csv-imports/${ANO}_EmendasParlamentaresPorDocumento.zip"
            URL="$BASE/download-de-dados/emendas-parlamentares-documentos/$ANO"

            # Data e tamanho do arquivo no governo (sem baixar).
            MARCA=$(curl -sIL -b /tmp/portal-cookies.txt --user-agent "$UA" --max-time 120 "$URL" \
              | tr -d '\r' \
              | awk '{ l = tolower($0) } l ~ /^last-modified:/ { lm = substr($0, 16) } l ~ /^content-length:/ { cl = $2 } END { print lm "|" cl }')
            VISTO=$(cat "data/portal-csv-imports/.vistos/$ANO" 2>/dev/null || true)
            echo ""
            echo "=== $ANO — arquivo no governo: $MARCA | já importado: ${VISTO:-nunca} ==="
            if [ "$FORCAR" != "true" ] && [ "$MARCA" != "|" ] && [ "$MARCA" = "$VISTO" ]; then
              echo "Sem mudança desde a última importação — pulando $ANO."
              continue
            fi
            echo "$MARCA" > "data/portal-csv-imports/.marca-$ANO"

            echo "=== Baixando $ANO ==="
            HTTP_INFO=$(curl -L \
              -b /tmp/portal-cookies.txt \
              --user-agent "$UA" \
              -H "Accept: application/zip,application/octet-stream,*/*" \
              -H "Accept-Language: pt-BR,pt;q=0.9" \
              -H "Referer: $BASE/download-de-dados/emendas-parlamentares-documentos" \
              --retry 3 --retry-delay 10 --retry-all-errors \
              --max-time 1800 \
              -w "\nHTTP_CODE=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}" \
              -o "$ZIP" \
              "$URL")
            echo "$HTTP_INFO"

            MAGIC=$(xxd -p -l 4 "$ZIP" 2>/dev/null || echo "erro-xxd")
            echo "Magic bytes: $MAGIC (esperado 504b0304 para ZIP)"

            if [ "$MAGIC" != "504b0304" ]; then
              echo "ERRO: $ANO nao e um ZIP valido — pulando"
              rm -f "$ZIP" "data/portal-csv-imports/.marca-$ANO"
              FALHOU=1
            else
              echo "ZIP valido: $(stat -c%s "$ZIP") bytes ($(ls -lh "$ZIP" | awk '{print $5}'))"
            fi
          done

          if [ "$FALHOU" != "0" ]; then exit 1; fi

      - name: Importar dados no banco
        id: importar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          BATCH="${{ github.event.inputs.batch || '500' }}"
          CONC="${{ github.event.inputs.concurrency || '150' }}"
          MODO="${{ github.event.inputs.modo || 'lote' }}"
          IMPORTOU=false
          IFS=',' read -ra ANOS_ARRAY <<< "$ANOS"
          for ANO in "${ANOS_ARRAY[@]}"; do
            ANO=$(echo "$ANO" | tr -d ' ')
            ZIP="data/portal-csv-imports/${ANO}_EmendasParlamentaresPorDocumento.zip"
            if [ -f "$ZIP" ]; then
              echo "=== Importando $ANO ==="
              npx tsx scripts/import-portal-csv.mts \
                --file "$ZIP" \
                --batch $BATCH \
                --concurrency $CONC \
                --modo $MODO
              # Só depois de importar com sucesso o ano conta como "visto".
              cp "data/portal-csv-imports/.marca-$ANO" "data/portal-csv-imports/.vistos/$ANO"
              IMPORTOU=true
            else
              echo "Nada a importar para $ANO."
            fi
          done
          echo "importou=$IMPORTOU" >> "$GITHUB_OUTPUT"

      - name: Reclassificar senadores
        if: steps.importar.outputs.importou == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sync-senadores.ts

      - name: Reclassificar areas
        if: steps.importar.outputs.importou == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/reclassificar-areas.ts

      # Os totais vêm da API do Portal, que muda mesmo quando o arquivo não muda:
      # roda sempre.
      - name: Atualizar totais oficiais das emendas
        # O CSV não traz o total da emenda; o Portal traz (empenhado e pago).
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
        run: npx tsx scripts/atualizar-totais-emendas-federais.ts --anos "$ANOS"

      - name: Atualizar resumo de Emendas
        # Números prontos da tela de Emendas (scripts/atualizar-resumo-emendas.ts).
        # Sem mudança no banco, o próprio script não recalcula.
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/atualizar-resumo-emendas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Import CSV Federal concluido" >> $GITHUB_STEP_SUMMARY
          echo "- **Anos:** $ANOS" >> $GITHUB_STEP_SUMMARY
          echo "- **Importou arquivo novo:** ${{ steps.importar.outputs.importou || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
