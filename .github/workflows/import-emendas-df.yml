name: Import Emendas DF (SISCONEP)

on:
  schedule:
    - cron: '0 4 * * 1'   # Toda segunda-feira 4h UTC → 2025 e 2026
    - cron: '0 2 5 * *'   # Dia 5 do mês 2h UTC       → 2021 a 2024
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos a importar, separados por vírgula (ex: 2021,2022,2023,2024,2025,2026)'
        required: false
        default: '2025,2026'
        type: string

jobs:
  import-df:
    name: Import DF SISCONEP
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANOS: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.anos ||
            github.event.schedule == '0 4 * * 1' && '2025,2026' ||
            '2021,2022,2023,2024' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/estados

      - name: Baixar dados do SISCONEP
        run: npx tsx scripts/download-emendas-df-sisconep.ts
        timeout-minutes: 10

      - name: Importar no banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          IFS=',' read -ra ANOS_ARRAY <<< "$ANOS"
          for ANO in "${ANOS_ARRAY[@]}"; do
            ANO=$(echo "$ANO" | tr -d ' ')
            FILE="data/estados/Emendas_DF_${ANO}.json"
            if [ -f "$FILE" ]; then
              echo "=== Importando $ANO ==="
              npx tsx --require dotenv/config scripts/estados/import-df.ts \
                --file "$FILE" \
                --ano "$ANO"
            else
              echo "Arquivo não encontrado para $ANO, pulando."
            fi
          done

      - name: Reclassificar areas
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx --require dotenv/config scripts/reclassificar-areas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Import DF (SISCONEP) concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Anos:** $ANOS" >> $GITHUB_STEP_SUMMARY
          echo "- **Horário:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
