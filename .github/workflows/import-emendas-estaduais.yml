name: Import — emendas estaduais

# Este workflow NÃO baixa os arquivos automaticamente (portais estaduais
# não oferecem download direto sem autenticação de navegador).
#
# Fluxo de uso:
#   1. Baixe manualmente os arquivos de cada estado (instruções nos scripts)
#   2. Coloque em data/estados/{uf}-{ano}.csv ou .xlsx
#   3. Faça upload via "git push" ou acione o workflow manualmente
#      passando os caminhos dos arquivos
#
# Disparar manualmente: Actions → "Import — emendas estaduais" → Run workflow
on:
  workflow_dispatch:
    inputs:
      estado:
        description: 'Estado (rs, sp, mg)'
        required: true
        type: choice
        options: [rs, sp, mg]
      arquivo:
        description: 'Caminho do arquivo no repo (ex: data/estados/rs-2022.xlsx)'
        required: true
        type: string
      ano:
        description: 'Ano dos dados'
        required: true
        default: '2025'
        type: string

jobs:
  import-estadual:
    name: Import ${{ inputs.estado }} ${{ inputs.ano }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Import RS
        if: inputs.estado == 'rs'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx tsx scripts/estados/import-rs.ts \
            --file "${{ inputs.arquivo }}" \
            --ano ${{ inputs.ano }}

      - name: Import SP
        if: inputs.estado == 'sp'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx tsx scripts/estados/import-sp.ts \
            --file "${{ inputs.arquivo }}" \
            --ano ${{ inputs.ano }}

      - name: Import MG
        if: inputs.estado == 'mg'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx tsx scripts/estados/import-mg.ts \
            --file "${{ inputs.arquivo }}" \
            --ano ${{ inputs.ano }}

      - name: Reclassificar áreas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/reclassificar-areas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Import Estadual" >> $GITHUB_STEP_SUMMARY
          echo "- **Estado:** ${{ inputs.estado }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Arquivo:** ${{ inputs.arquivo }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ano:** ${{ inputs.ano }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Horário:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
