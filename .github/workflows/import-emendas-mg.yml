name: Import Emendas MG (ALMG)

# O portal de MG e atualizado de tempos em tempos, nao toda semana. O passo de
# baixar pergunta ao servidor se a planilha mudou (requisicao condicional) e,
# se nao mudou, o import nem roda — nada de reescrever milhares de linhas a toa.

on:
  schedule:
    - cron: '0 4 * * 2'   # Terca-feira 4h UTC (segunda ja e do DF)
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Baixar e importar mesmo sem alteracao no portal'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'So conferir, sem gravar no banco'
        required: false
        default: false
        type: boolean

jobs:
  import-mg:
    name: Import MG ALMG
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/estados

      # Guarda o ETag de cada planilha entre as execucoes. A chave muda a cada
      # run para que o valor novo seja sempre salvo; restore-keys recupera o da
      # execucao anterior. Se o cache sumir, o pior que acontece e uma
      # importacao a mais — o import e idempotente.
      - name: Recuperar o que ja foi visto no portal
        uses: actions/cache@v4
        with:
          path: data/estados/.mg-estado.json
          key: mg-estado-${{ github.run_id }}
          restore-keys: |
            mg-estado-

      - name: Baixar planilhas (so o que mudou)
        id: baixar
        env:
          FORCAR: ${{ inputs.forcar && '1' || '0' }}
          # O portal recusa a faixa de IP do GitHub Actions (403, pagina e
          # arquivo). Com o segredo PROXY_MG definido, a chamada passa por um
          # intermediario que ele aceite; sem ele, vai direto e falha aqui.
          PROXY_MG: ${{ secrets.PROXY_MG }}
        run: npx tsx scripts/download-emendas-mg.ts
        timeout-minutes: 15

      - name: Importar no banco
        if: steps.baixar.outputs.mudou == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          for ARQ in ${{ steps.baixar.outputs.arquivos }}; do
            echo "=== Importando $ARQ ==="
            npx tsx --require dotenv/config scripts/estados/import-mg.ts \
              --file "$ARQ" $DRY
          done

      - name: Reclassificar areas
        if: steps.baixar.outputs.mudou == 'true' && !inputs.dry_run
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx --require dotenv/config scripts/reclassificar-areas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Import MG (ALMG)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.baixar.outputs.mudou }}" = "true" ]; then
            echo "- **Planilhas atualizadas:** ${{ steps.baixar.outputs.arquivos }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Nada mudou no portal — nenhuma importacao foi feita." >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
