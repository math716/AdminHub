name: Emendas Estaduais 2026 PR

on:
  schedule:
    - cron: '0 6 * * 1'   # toda segunda-feira às 06h UTC
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos a extrair (separados por vírgula, ex: 2024,2025,2026)'
        required: false
        default: '2026'
        type: string
      apenas_extrair:
        description: 'Apenas extrair CSV, sem importar no banco'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  extract-and-import:
    name: Extrair Power BI → Importar banco
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: pip install requests

      - name: Criar diretórios de saída
        run: mkdir -p data/estados/powerbi_pr_raw

      - name: Extrair dados do Power BI
        run: |
          ANOS="${{ github.event.inputs.anos || '2026' }}"
          echo "Anos a extrair: $ANOS"
          python scripts/scrape-powerbi-pr.py --anos "$ANOS"

      - name: Listar arquivos gerados
        run: |
          echo "## Arquivos CSV gerados:" >> $GITHUB_STEP_SUMMARY
          ls -lh data/estados/emendas_PR_*.csv 2>/dev/null \
            | awk '{print "- **"$9"** ("$5")"}' >> $GITHUB_STEP_SUMMARY || echo "Nenhum CSV gerado" >> $GITHUB_STEP_SUMMARY
          wc -l data/estados/emendas_PR_*.csv 2>/dev/null >> $GITHUB_STEP_SUMMARY || true

      - name: Instalar dependências de importação
        if: ${{ github.event.inputs.apenas_extrair != 'true' }}
        run: pip install psycopg2-binary

      - name: Importar CSVs no banco
        if: ${{ github.event.inputs.apenas_extrair != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ANOS="${{ github.event.inputs.anos || '2026' }}"
          echo "Anos a importar: $ANOS"
          python scripts/import-emendas-pr.py --anos "$ANOS"

      - name: Resumo final
        if: always()
        run: |
          echo "## Import Emendas PR concluído" >> $GITHUB_STEP_SUMMARY
          echo "- **Horário:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Anos:** ${{ github.event.inputs.anos || '2020-2026' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Apenas extração:** ${{ github.event.inputs.apenas_extrair || 'false' }}" >> $GITHUB_STEP_SUMMARY
