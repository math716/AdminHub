name: Rotina · Emendas SP

# ─── Calendário das importações (horário de Brasília) ───────────────────────
# O GitHub agenda em UTC (Brasília + 3h). Todos os workflows que gravam no banco
# estão na MESMA fila (concurrency: importacao-banco): um espera o outro. O
# GitHub guarda só UM esperando — um terceiro que chegue cancela o que estava
# esperando. Por isso cada rotina tem o seu dia.
#
#   Semanal
#     sexta   22h  Rotina · Emendas federais  2025
#     sábado  24h  Rotina · Emendas RJ        2025 e 2026
#     domingo 23h  Rotina · Emendas federais  2026
#     segunda 24h  Rotina · Emendas SP        2025 e 2026
#     terça   24h  Rotina · Emendas DF        2025 e 2026
#   Mensal
#     dia 1   (23h da véspera)  Rotina · Emendas federais  2024
#     dia 3   (23h da véspera)  Rotina · Emendas SP        2023 e 2024
#     dia 5   (23h da véspera)  Rotina · Emendas DF        2021 a 2024
#     dia 15  (23h da véspera)  Rotina · Emendas federais  2023
#     dia 20  01h               Rotina · Emendas federais  2021 e 2022
#   Manual
#     Ferramenta · Resumo de Emendas — recalcula/confere a tela de Emendas
#     (todas as rotinas já fazem isso no fim; é a reserva).
#
# Arquivo do governo igual ao da última vez → a rotina pula a importação e só
# atualiza totais e resumo (leve). Só os jobs com
# if: github.repository == 'math716/AdminHub' — o admorbitatech nunca executa.
# ─────────────────────────────────────────────────────────────────────────────

# Fonte: base aberta do portal da transparencia de SP (emendas.zip).
#
# Substituiu o painel do Power BI, que era aberto por navegador e publicava um
# conjunto DIFERENTE do portal: em setembro de 2026 o deputado Gilmaci Santos
# aparecia no sistema com 12 emendas de 2026 (R$ 13,2 M) contra 5 no portal
# (R$ 4,8 M). Some o Chromium, e os numeros passam a bater com a fonte oficial.
#
# O download so acontece se o arquivo mudou (ETag), e o import cobre 2019 a 2026
# de uma vez — o CSV traz todos os anos juntos.

on:
  schedule:
    - cron: '0 3 * * 2'   # Toda terça-feira 3h UTC → 2025 e 2026 (segunda é da federal)
    - cron: '0 2 3 * *'   # Dia 3 do mes 2h UTC       → 2023 e 2024
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos a importar (vazio = todos os do arquivo)'
        required: false
        default: ''
        type: string
      forcar:
        description: 'Baixar e importar mesmo sem alteracao no portal'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'So conferir, sem gravar nem apagar'
        required: false
        default: false
        type: boolean


# Fila única das importações: um workflow que escreve no banco espera o outro
# terminar (inclusive disparo manual). Rodando juntos, a federal (150 operações
# simultâneas), SP e DF disputavam o banco na madrugada de segunda.
# Atenção: o GitHub guarda só UM pendente por grupo — um terceiro na fila
# substitui o pendente anterior. Por isso cada importação pesada tem o seu dia.
concurrency:
  group: importacao-banco
  cancel-in-progress: false

jobs:
  import-sp:
    name: Import SP Transparencia
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    # O tempo aqui e do banco, nao do download. Medido: 40 minutos deram 15.220
    # das 42.304 emendas, entao a carga completa passa de duas horas. O teto do
    # GitHub e 6 horas; ficamos perto disso, porque um import cortado no meio
    # deixa o banco em estado parcial — pior que demorar.
    timeout-minutes: 350

    # Que anos entram, conforme quem disparou.
    #
    # O `|| ''` no fim nao e enfeite: numa execucao manual com o campo em
    # branco, o primeiro termo da vazio e a expressao continua avaliando os
    # seguintes. Sem ele, pedir "todos os anos" traria 2023 e 2024.
    env:
      ANOS: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.anos
            || github.event.schedule == '0 3 * * 2' && '2025,2026'
            || github.event.schedule == '0 2 3 * *' && '2023,2024'
            || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/estados

      # Guarda o ETag entre execucoes. A chave muda a cada run para que o valor
      # novo seja sempre salvo; restore-keys recupera o da execucao anterior.
      # Cache perdido custa no maximo uma importacao a mais — o import e
      # idempotente.
      - name: Recuperar o que ja foi visto no portal
        uses: actions/cache@v4
        with:
          path: data/estados/.sp-estado.json
          key: sp-estado-${{ github.run_id }}
          restore-keys: |
            sp-estado-

      - name: Baixar base aberta (so o que mudou)
        id: baixar
        env:
          FORCAR: ${{ inputs.forcar && '1' || '0' }}
        run: npx tsx scripts/download-emendas-sp.ts
        timeout-minutes: 15

      - name: Importar no banco
        if: steps.baixar.outputs.mudou == 'true'
        timeout-minutes: 300
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          ARGS=""
          if [ -n "$ANOS" ]; then ARGS="--anos $ANOS"; fi
          npx tsx --require dotenv/config scripts/estados/import-sp-aberto.ts $ARGS $DRY

      - name: Backfill codigos IBGE
        if: steps.baixar.outputs.mudou == 'true' && !inputs.dry_run
        continue-on-error: true
        timeout-minutes: 15
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx --require dotenv/config scripts/backfill-municipios-ibge.ts --uf SP

      - name: Reclassificar areas
        if: steps.baixar.outputs.mudou == 'true' && !inputs.dry_run
        continue-on-error: true
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx --require dotenv/config scripts/reclassificar-areas.ts

      - name: Atualizar resumo de Emendas
        # Números prontos da tela de Emendas (scripts/atualizar-resumo-emendas.ts).
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/atualizar-resumo-emendas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Import SP (portal da transparencia)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.baixar.outputs.mudou }}" = "true" ]; then
            echo "- Base atualizada e importada." >> $GITHUB_STEP_SUMMARY
          else
            echo "- Nada mudou no portal — nenhuma importacao foi feita." >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
