name: Import estadual - Minas Gerais

on:
  schedule:
    - cron: '0 4 * * 0'  # Domingo 4h UTC (sábado 1h Brasília)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (não grava no banco)'
        required: false
        default: false
        type: boolean
      discover:
        description: 'Discover (só imprime colunas do arquivo, sem importar)'
        required: false
        default: false
        type: boolean

jobs:
  import-mg:
    name: Import MG
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/estados

      - name: Descobrir e baixar arquivo do portal MG
        run: |
          PAGE_URL="https://www.emendas.mg.gov.br/transparencia/"
          DEST="data/estados/mg-emendas.xlsx"
          YEAR=$(date +%Y)

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          echo "=== Tentando scraping da página do portal MG ==="
          HTML=$(curl -s --max-time 30 \
            -H "User-Agent: $UA" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.8" \
            -H "Accept-Encoding: gzip, deflate, br" \
            -H "Connection: keep-alive" \
            --compressed \
            "$PAGE_URL" 2>/dev/null)

          HREF=""

          if [ -n "$HTML" ] && ! echo "$HTML" | grep -qi "403 Forbidden"; then
            # Extrai o href do XLSX de emendas (exclui dicionário e anos antigos)
            HREF=$(echo "$HTML" | grep -oiE \
              'https?://[^"'"'"' >]*DADOS_EMENDAS[^"'"'"' >]*\.xlsx' \
              | grep -iv 'dicionario\|2019\|2020\|2021\|2022' \
              | head -1)

            # Fallback: qualquer XLSX de dados de emendas
            if [ -z "$HREF" ]; then
              HREF=$(echo "$HTML" | grep -oiE \
                'https?://[^"'"'"' >]*DADOS_EMENDAS[^"'"'"' >]*\.xlsx' \
                | grep -iv 'dicionario' \
                | head -1)
            fi
          else
            echo "Scraping bloqueado (403 ou resposta vazia) — tentando URL direta"
          fi

          # Fallback: construir URL diretamente pelo padrão conhecido do portal
          # Formato: https://www.emendas.mg.gov.br/wp-content/dados-emendas/${YEAR}_Marcel/DADOS_EMENDAS_${YEAR}.xlsx
          if [ -z "$HREF" ]; then
            echo "=== Tentando URL direta (fallback) ==="
            for CANDIDATE_YEAR in $YEAR $((YEAR - 1)); do
              CANDIDATE="https://www.emendas.mg.gov.br/wp-content/dados-emendas/${CANDIDATE_YEAR}_Marcel/DADOS_EMENDAS_${CANDIDATE_YEAR}.xlsx"
              echo "Testando: $CANDIDATE"
              HTTP_TEST=$(curl -L --head -s --max-time 20 \
                -H "User-Agent: $UA" \
                -H "Accept: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*" \
                -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.8" \
                --compressed \
                -w "%{http_code}" -o /dev/null "$CANDIDATE")
              echo "  HTTP: $HTTP_TEST"
              if [ "$HTTP_TEST" = "200" ]; then
                HREF="$CANDIDATE"
                break
              fi
            done
          fi

          if [ -z "$HREF" ]; then
            echo "ERRO: link do XLSX não encontrado (scraping e fallback falharam)"
            if [ -n "$HTML" ]; then
              echo "--- HTML (primeiras 100 linhas) ---"
              echo "$HTML" | head -100
            fi
            exit 1
          fi

          echo "URL encontrada: $HREF"
          HTTP_CODE=$(curl -L \
            --retry 3 --retry-delay 10 \
            --max-time 300 \
            -H "User-Agent: $UA" \
            -H "Accept: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*" \
            -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.8" \
            --compressed \
            -w "%{http_code}" \
            -o "$DEST" \
            "$HREF")
          echo "HTTP: $HTTP_CODE — $(stat -c%s "$DEST" 2>/dev/null || echo 0) bytes"

          if [ "$HTTP_CODE" != "200" ] || [ ! -s "$DEST" ]; then
            echo "ERRO: download falhou (HTTP $HTTP_CODE)"
            rm -f "$DEST"
            exit 1
          fi

          echo "Arquivo salvo: $DEST"

      - name: Importar dados no banco
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.discover != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== Importando MG ==="
          npx tsx --require dotenv/config scripts/estados/import-mg.ts \
            --file data/estados/mg-emendas.xlsx

      - name: Dry run
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=== [DRY RUN] MG ==="
          npx tsx --require dotenv/config scripts/estados/import-mg.ts \
            --file data/estados/mg-emendas.xlsx \
            --dry-run

      - name: Discover (inspecionar colunas)
        if: ${{ github.event.inputs.discover == 'true' }}
        run: |
          echo "=== [DISCOVER] Colunas do arquivo MG ==="
          npx tsx --require dotenv/config scripts/estados/import-mg.ts \
            --file data/estados/mg-emendas.xlsx \
            --discover

      - name: Resumo
        if: always()
        run: |
          echo "## Import MG concluido" >> $GITHUB_STEP_SUMMARY
          echo "- **Modo:** ${{ github.event.inputs.discover == 'true' && 'Discover' || github.event.inputs.dry_run == 'true' && 'Dry run' || 'Real' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
