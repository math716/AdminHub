name: Rotina · Emendas RJ

# ─── Calendário das importações (horário de Brasília) ───────────────────────
# O GitHub agenda em UTC (Brasília + 3h). Todos os workflows que gravam no banco
# estão na MESMA fila (concurrency: importacao-banco): um espera o outro. O
# GitHub guarda só UM esperando — um terceiro que chegue cancela o que estava
# esperando. Por isso cada rotina tem o seu dia.
#
#   Semanal
#     sexta   22h  Rotina · Emendas federais  2025
#     sábado  24h  Rotina · Emendas RJ        2025 e 2026
#     domingo 23h  Rotina · Emendas federais  2026
#     segunda 24h  Rotina · Emendas SP        2025 e 2026
#     terça   24h  Rotina · Emendas DF        2025 e 2026
#     quarta  24h  Rotina · Emendas ES, MG e PE  (os anos cujo arquivo mudou)
#   Mensal
#     dia 1   (23h da véspera)  Rotina · Emendas federais  2024
#     dia 3   (23h da véspera)  Rotina · Emendas SP        2023 e 2024
#     dia 5   (23h da véspera)  Rotina · Emendas DF        2021 a 2024
#     dia 15  (23h da véspera)  Rotina · Emendas federais  2023
#     dia 20  01h               Rotina · Emendas federais  2021 e 2022
#   Manual
#     Ferramenta · Resumo de Emendas — recalcula/confere a tela de Emendas
#     (todas as rotinas já fazem isso no fim; é a reserva).
#
# Arquivo do governo igual ao da última vez → a rotina pula a importação e só
# atualiza totais e resumo (leve). Só os jobs com
# if: github.repository == 'math716/AdminHub' — o admorbitatech nunca executa.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 3 * * 0'  # Domingo 3h UTC (sábado 24h Brasília)
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos a importar, separados por vírgula (ex: 2024,2025,2026)'
        required: false
        default: '2025,2026'
        type: string
      dry_run:
        description: 'Dry run (não grava no banco)'
        required: false
        default: false
        type: boolean


# Fila única das importações: um workflow que escreve no banco espera o outro
# terminar (inclusive disparo manual). Rodando juntos, a federal (150 operações
# simultâneas), SP e DF disputavam o banco na madrugada de segunda.
# Atenção: o GitHub guarda só UM pendente por grupo — um terceiro na fila
# substitui o pendente anterior. Por isso cada importação pesada tem o seu dia.
concurrency:
  group: importacao-banco
  cancel-in-progress: false

jobs:
  import-rj:
    name: Import RJ
    if: github.repository == 'math716/AdminHub'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Criar diretorio de dados
        run: mkdir -p data/estados

      - name: Descobrir e baixar arquivos do portal RJ
        run: |
          BASE="https://redeplan.planejamento.rj.gov.br"
          PAGE_URL="$BASE/demaisprocessos/emendas.html"
          ANOS="${{ github.event.inputs.anos || '2025,2026' }}"

          echo "=== Baixando página do portal RJ ==="
          HTML=$(curl -s --insecure --max-time 30 "$PAGE_URL")
          if [ -z "$HTML" ]; then
            echo "ERRO: não foi possível acessar $PAGE_URL"
            exit 1
          fi

          FALHOU=0
          IFS=',' read -ra ANOS_ARRAY <<< "$ANOS"
          for ANO in "${ANOS_ARRAY[@]}"; do
            ANO=$(echo "$ANO" | tr -d ' ')
            echo ""
            echo "=== Buscando arquivo de $ANO ==="

            # Extrai o href do arquivo principal (sem "fase", prefere XLSX sobre CSV)
            # Ordem: detalhamento XLSX → detalhamento CSV → EmendasImpositivas XLSX → CSV
            HREF=$(echo "$HTML" | grep -oiE \
              '/img/docs/emendas[^"'"'"' >]*[Dd]etalhamento[^"'"'"' >]*'"$ANO"'[^"'"'"' >]*\.xlsx' \
              | grep -iv 'fase' | head -1)

            if [ -z "$HREF" ]; then
              HREF=$(echo "$HTML" | grep -oiE \
                '/img/docs/emendas[^"'"'"' >]*[Dd]etalhamento[^"'"'"' >]*'"$ANO"'[^"'"'"' >]*\.csv' \
                | grep -iv 'fase' | head -1)
            fi

            if [ -z "$HREF" ]; then
              HREF=$(echo "$HTML" | grep -oiE \
                '/img/docs/emendas[^"'"'"' >]*[Ee]mendas[Ii]mpositivas'"$ANO"'[^"'"'"' >]*\.xlsx' \
                | grep -iv 'fase' | head -1)
            fi

            if [ -z "$HREF" ]; then
              HREF=$(echo "$HTML" | grep -oiE \
                '/img/docs/emendas[^"'"'"' >]*[Ee]mendas[Ii]mpositivas'"$ANO"'[^"'"'"' >]*\.csv' \
                | grep -iv 'fase' | head -1)
            fi

            if [ -z "$HREF" ]; then
              echo "AVISO: link do arquivo $ANO não encontrado na página — pulando"
              FALHOU=1
              continue
            fi

            URL="$BASE$HREF"
            EXT="${HREF##*.}"
            DEST="data/estados/rj-${ANO}.${EXT}"

            echo "URL encontrada: $URL"
            HTTP_CODE=$(curl -L --insecure \
              --retry 3 --retry-delay 10 \
              --max-time 300 \
              -w "%{http_code}" \
              -o "$DEST" \
              "$URL")
            echo "HTTP: $HTTP_CODE — $(stat -c%s "$DEST" 2>/dev/null || echo 0) bytes"

            if [ "$HTTP_CODE" != "200" ] || [ ! -s "$DEST" ]; then
              echo "ERRO: download de $ANO falhou (HTTP $HTTP_CODE)"
              rm -f "$DEST"
              FALHOU=1
            else
              echo "Arquivo salvo: $DEST"
            fi
          done

          if [ "$FALHOU" != "0" ]; then exit 1; fi

      - name: Importar dados no banco
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ANOS="${{ github.event.inputs.anos || '2025,2026' }}"
          IFS=',' read -ra ANOS_ARRAY <<< "$ANOS"
          for ANO in "${ANOS_ARRAY[@]}"; do
            ANO=$(echo "$ANO" | tr -d ' ')
            # Tenta CSV primeiro, depois XLSX
            FILE=""
            if [ -f "data/estados/rj-${ANO}.csv" ]; then FILE="data/estados/rj-${ANO}.csv"; fi
            if [ -f "data/estados/rj-${ANO}.xlsx" ]; then FILE="data/estados/rj-${ANO}.xlsx"; fi

            if [ -n "$FILE" ]; then
              echo "=== Importando RJ $ANO ($FILE) ==="
              npx tsx --require dotenv/config scripts/estados/import-rj.ts \
                --file "$FILE" \
                --ano "$ANO"
            else
              echo "Arquivo de $ANO não encontrado, pulando."
            fi
          done

      - name: Dry run
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ANOS="${{ github.event.inputs.anos || '2025,2026' }}"
          IFS=',' read -ra ANOS_ARRAY <<< "$ANOS"
          for ANO in "${ANOS_ARRAY[@]}"; do
            ANO=$(echo "$ANO" | tr -d ' ')
            FILE=""
            if [ -f "data/estados/rj-${ANO}.csv" ]; then FILE="data/estados/rj-${ANO}.csv"; fi
            if [ -f "data/estados/rj-${ANO}.xlsx" ]; then FILE="data/estados/rj-${ANO}.xlsx"; fi

            if [ -n "$FILE" ]; then
              echo "=== [DRY RUN] RJ $ANO ($FILE) ==="
              npx tsx --require dotenv/config scripts/estados/import-rj.ts \
                --file "$FILE" \
                --ano "$ANO" \
                --dry-run
            fi
          done

      - name: Atualizar resumo de Emendas
        # Números prontos da tela de Emendas (scripts/atualizar-resumo-emendas.ts).
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/atualizar-resumo-emendas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Import RJ concluido" >> $GITHUB_STEP_SUMMARY
          echo "- **Anos:** ${{ github.event.inputs.anos || '2025,2026' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
