name: Reclassificar áreas (OUTROS)

on:
  workflow_dispatch:

jobs:
  reclassificar:
    name: Reclassificar áreas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Reclassificar areas OUTROS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx --require dotenv/config scripts/reclassificar-areas.ts

      - name: Resumo
        if: always()
        run: |
          echo "## Reclassificação concluída" >> $GITHUB_STEP_SUMMARY
          echo "- **Horario:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
